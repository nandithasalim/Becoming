<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05040C">
<title>Becoming · Meet your future self</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05040C;color:#F4F0FF;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:rgba(244,240,255,.6)}

  /* coming in from the chat or letter: we arrive through their light */
  .arrive{position:fixed;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle at 50% 30%,#fff 0%,#FFE3EE 45%,#FFD8B8 100%);opacity:0;display:none}
  .arrive.on{display:block;opacity:1}
  .arrive.out{opacity:0;transition:opacity 1.6s cubic-bezier(.4,0,.2,1)}

  .scrim{position:fixed;pointer-events:none;opacity:0;transition:opacity 1.5s ease}
  .scrim.on{opacity:1}
  body.wide .scrim{top:0;right:0;bottom:0;width:38vw;background:linear-gradient(to left,rgba(5,4,12,.75) 35%,rgba(5,4,12,0))}
  body:not(.wide) .scrim{left:0;right:0;bottom:0;height:50vh;background:linear-gradient(to top,rgba(5,4,12,.94) 35%,rgba(5,4,12,.55) 70%,rgba(5,4,12,0))}

  .story{position:fixed;z-index:2;pointer-events:none}
  body.wide .story{right:6vw;top:50%;transform:translateY(-50%);width:min(380px,30vw);text-align:left}
  body:not(.wide) .story{left:0;right:0;bottom:0;padding:0 22px max(22px,env(safe-area-inset-bottom));text-align:center}
  .eb{font-size:11px;letter-spacing:.32em;text-transform:uppercase;margin:0 0 10px;color:#FFC48A;text-shadow:0 0 14px rgba(255,196,138,.5)}
  .name{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(42px,9vw,64px);line-height:1;margin:0 0 16px;color:#FFE7EF;
    text-shadow:0 0 18px rgba(255,143,184,.55),0 0 50px rgba(255,196,138,.3)}
  body.wide .name{font-size:clamp(40px,4.6vw,66px)}
  .line{font-family:'Instrument Serif',Georgia,serif;font-size:21px;line-height:1.4;margin:0 0 4px;color:#E9E4F7;text-shadow:0 0 20px rgba(177,140,255,.25);min-height:1.4em}
  .line.strong{font-style:italic;color:#FFE2C2;text-shadow:0 0 18px rgba(255,196,138,.45)}
  .w{display:inline-block;white-space:pre;opacity:0;filter:blur(10px);transform:translateY(6px);transition:opacity .9s cubic-bezier(.16,1,.3,1),filter .9s,transform .9s}
  .w.in{opacity:1;filter:blur(0);transform:none}
  body:not(.wide) .line{font-size:18px}

  .acts{display:flex;flex-direction:column;gap:10px;margin-top:22px;opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1s cubic-bezier(.16,1,.3,1)}
  .acts.in{opacity:1;transform:none;pointer-events:auto}
  .row{display:flex;gap:10px}
  .primary,.ghost{font:500 15px Inter,sans-serif;color:#F4F0FF;cursor:pointer;border-radius:999px;backdrop-filter:blur(10px)}
  .primary{height:52px;border:1px solid rgba(244,240,255,.45);background:rgba(255,255,255,.1);box-shadow:0 0 40px rgba(177,140,255,.35);animation:call 2.4s ease-in-out infinite}
  .primary:hover{background:#F4F0FF;color:#05040C}
  @keyframes call{50%{box-shadow:0 0 60px rgba(255,143,184,.5)}}
  .ghost{flex:1;height:46px;border:1px solid rgba(244,240,255,.18);background:rgba(255,255,255,.04)}
  .ghost:hover{border-color:rgba(244,240,255,.5)}
  .touch{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,240,255,.32);margin:14px 0 0}
  body:not(.wide) .acts{margin-top:16px}
  @media (prefers-reduced-motion:reduce){.w,.acts{transition:none}.primary{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="scrim" id="scrim"></div>
<div class="arrive" id="arrive" aria-hidden="true"></div>
<div class="fail" id="fail">This needs a browser with WebGL. Try opening it in Chrome.</div>

<section class="story" aria-live="polite">
  <p class="eb" id="eb">This is who you become</p>
  <p class="name" id="nm"></p>
  <p class="line" id="l1"></p>
  <p class="line" id="l2"></p>
  <p class="line strong" id="l3"></p>
  <div class="acts" id="acts">
    <button class="primary" id="start">Start becoming them</button>
    <div class="row"><button class="ghost" id="replay">Replay</button><button class="ghost" id="edit">Change my answers</button></div>
    <p class="touch">Tap them</p>
  </div>
</section>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const FIXED = Q.has('t') ? parseFloat(Q.get('t')) : null;     // for testing: show one exact moment
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const eOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const eIO = (x) => { x = clamp01(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2; };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- the words ----------
const name = (Q.get('n') || '').trim() || 'You';
const role = Q.get('role') || 'designer', place = Q.get('place') || 'a home by the sea', feel = Q.get('feel') || 'calm';
const DOING = { designer: 'designing', founder: 'running my own company', doctor: 'healing people', artist: 'making art', engineer: 'building tech', teacher: 'teaching' };
const doing = DOING[role] || role.charAt(0).toLowerCase() + role.slice(1);
const TEXT = { nm: `${name}, 2031`, l1: `I spend my days ${doing}, and I wake up in ${place}.`, l2: `I feel ${feel}. Most days, I really do.`, l3: 'And it all started with you. Today.' };
const words = [];
for (const [id, at] of [['eb', 7.2], ['nm', 7.6], ['l1', 8.4], ['l2', 9.6], ['l3', 10.6]]) {
  const el = $(id); const text = TEXT[id] || el.textContent; el.textContent = ''; el.setAttribute('aria-label', text);
  text.split(/(\s+)/).forEach((w, i) => { if (/^\s+$/.test(w)) return el.appendChild(document.createTextNode(w));
    const s = document.createElement('span'); s.className = 'w'; s.textContent = w; el.appendChild(s); words.push([s, at + i * 0.03]); });
}
const ACTS_AT = 11.8;

// ---------- renderer ----------
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' }); }
catch (e) { $('fail').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 100);
const look = new THREE.Vector3();
let wide = true;

// the eclipse: a huge ring of light behind their head
const sky = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ depthWrite: false, depthTest: false,
  uniforms: { uR: { value: new THREE.Vector2(1, 1) }, uT: { value: 0 }, uC: { value: new THREE.Vector2(.5, .6) }, uRad: { value: .25 }, uIgn: { value: 0 }, uPulse: { value: 0 } },
  vertexShader: 'void main(){ gl_Position=vec4(position.xy,.999,1.); }',
  fragmentShader: `uniform vec2 uR, uC; uniform float uT, uRad, uIgn, uPulse;
    float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }
    void main(){
      vec2 p=(gl_FragCoord.xy-uC)/uR.y; float d=length(p);
      float R=uRad*(.15+.85*uIgn), I=smoothstep(0.,.35,uIgn)*(1.+.6*uPulse);
      float e0=max(d-R,0.)*3.; vec3 c=vec3(.008,.007,.016) + vec3(.22,.12,.38)*exp(-e0*e0)*.12*I;
      float e1=(d-R)*110., e2=(d-R)*30., e3=max(d-R,0.)*8.;   // squared by multiplying: pow() of a negative number breaks on Mac GPUs
      c+=vec3(1.,.8,.62)*exp(-e1*e1)*1.3*I + vec3(1.,.5,.45)*exp(-e2*e2)*.4*I + vec3(.5,.3,.9)*exp(-e3*e3)*.22*I;
      c*=mix(1., .03, (1.-smoothstep(R-.004, R, d))*I);
      vec2 q=gl_FragCoord.xy/3.; float r=h(floor(q)); c+=vec3(1.)*step(.997,r)*smoothstep(.45,.0,length(fract(q)-.5))*(.35+.35*sin(uT*1.3+r*90.))*step(R+.02,d);
      gl_FragColor=vec4(pow(max(c,0.),vec3(2.2)),1.);
    }` }));
sky.frustumCulled = false; sky.renderOrder = -2; scene.add(sky);

// the orb from the chat
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,244,236,1)'); g.addColorStop(.18,'rgba(255,196,218,.85)');
  g.addColorStop(.45,'rgba(177,140,255,.35)'); g.addColorStop(1,'rgba(120,80,255,0)'); x.fillStyle = g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
const orb = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(orb);
const dotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d');
  const g = x.createRadialGradient(16,16,0,16,16,16); g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0,0,32,32); return new THREE.CanvasTexture(c); })();

// ---------- the smooth stomach, hips and legs (one surface) ----------
const smin = (a, b, k) => { const h = Math.max(0, Math.min(1, .5 + .5 * (b - a) / k)); return b + (a - b) * h - k * h * (1 - h); };
const ell = (x, y, z, c, r) => { const px = (x-c[0])/r[0], py = (y-c[1])/r[1], pz = (z-c[2])/r[2]; const k0 = Math.hypot(px, py, pz);
  const k1 = Math.hypot((x-c[0])/(r[0]*r[0]), (y-c[1])/(r[1]*r[1]), (z-c[2])/(r[2]*r[2])); return k0 * (k0 - 1) / k1; };
const cap = (x, y, z, a, b, ra, rb) => { const pa = [x-a[0], y-a[1], z-a[2]], ba = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
  const h = Math.max(0, Math.min(1, (pa[0]*ba[0]+pa[1]*ba[1]+pa[2]*ba[2]) / (ba[0]*ba[0]+ba[1]*ba[1]+ba[2]*ba[2])));
  return Math.hypot(pa[0]-ba[0]*h, pa[1]-ba[1]*h, pa[2]-ba[2]*h) - (ra + (rb - ra) * h); };
function lower(x, y, z) {
  const ax = Math.abs(x);
  let d = ell(x, y, z, [0, 1.27, .035], [.15, .125, .11]);
  d = smin(d, ell(x, y, z, [0, 1.11, .02], [.118, .11, .088]), .07);
  d = smin(d, ell(x, y, z, [0, .95, .01], [.15, .1, .1]), .07);
  d = smin(d, cap(ax, y, z, [.08, .93, .008], [.145, .51, .03], .074, .054), .06);
  d = smin(d, cap(ax, y, z, [.145, .51, .03], [.205, .09, -.02], .052, .034), .025);
  d = smin(d, cap(ax, y, z, [.205, .06, -.03], [.232, .03, .11], .036, .03), .02);
  return d;
}
function lowerSurface(material) {   // the smooth lower body as one mesh, in the figure's rest space
  const BOX = { x: [-.36, .36], y: [-.03, 1.42], z: [-.24, .32] }, R = 84;
  const mc = new MarchingCubes(R, material, false, false, 300000); mc.isolation = 0;
  for (let k = 0; k < R; k++) for (let j = 0; j < R; j++) for (let i = 0; i < R; i++)
    mc.field[i + j*R + k*R*R] = -lower(BOX.x[0] + (BOX.x[1]-BOX.x[0]) * i/(R-1), BOX.y[0] + (BOX.y[1]-BOX.y[0]) * j/(R-1), BOX.z[0] + (BOX.z[1]-BOX.z[0]) * k/(R-1)) * 40;
  mc.update();
  mc.scale.set((BOX.x[1]-BOX.x[0])/2, (BOX.y[1]-BOX.y[0])/2, (BOX.z[1]-BOX.z[0])/2);
  mc.position.set((BOX.x[0]+BOX.x[1])/2, (BOX.y[0]+BOX.y[1])/2, (BOX.z[0]+BOX.z[1])/2); mc.updateMatrixWorld(true);
  return mc;
}

// ---------- the figure: a silhouette in front of the light ----------
let figure = null;
new GLTFLoader().load('./assets/xbot.glb', (g) => {
  const model = g.scene;
  const mixer = new THREE.AnimationMixer(model);
  mixer.clipAction(g.animations.find((a) => a.name === 'idle')).play();
  mixer.setTime(0.4); model.updateMatrixWorld(true);                 // one calm standing pose, held still
  const box = new THREE.Box3().setFromObject(model); const S = 1.75 / (box.max.y - box.min.y);
  model.scale.setScalar(S); model.position.y = -box.min.y * S; scene.add(model);
  const base = model.position.y;
  const meshes = []; model.traverse((o) => { if (o.isSkinnedMesh) meshes.push(o); });
  const bone = (n) => model.getObjectByName('mixamorig' + n);
  const B = { neck: bone('Neck'), head: bone('Head'), la: bone('LeftArm'), ra: bone('RightArm'), lf: bone('LeftForeArm'), rf: bone('RightForeArm') };
  const rest = new Map(); for (const b of Object.values(B)) rest.set(b, b.quaternion.clone());

  // turn a rotation given in the figure's own space into the bone's space, on top of its rest pose
  const qA = new THREE.Quaternion(), qB = new THREE.Quaternion(), qR = new THREE.Quaternion(), ax = new THREE.Vector3();
  function rotate(b, axis, angle) {
    if (!angle) return;
    b.parent.getWorldQuaternion(qA); model.getWorldQuaternion(qR);
    qB.setFromAxisAngle(ax.copy(axis), angle);
    const toParent = qA.clone().invert().multiply(qR);
    b.quaternion.premultiply(toParent.clone().multiply(qB).multiply(toParent.clone().invert()));
  }
  const X = new THREE.Vector3(1, 0, 0), Z = new THREE.Vector3(0, 0, 1);
  function pose(t) {
    for (const [b, q] of rest) b.quaternion.copy(q);
    const turn = eIO((t - 3.6) / 1.6), lift = eIO((t - 5.0) / 1.2), open = eIO((t - 5.6) / 1.4);
    model.rotation.y = Math.PI * (1 - turn);
    model.updateMatrixWorld(true);
    rotate(B.neck, X, 0.35 * (1 - lift)); rotate(B.head, X, 0.2 * (1 - lift));      // head bowed, then lifts
    model.updateMatrixWorld(true);
    rotate(B.la, Z, 0.35 * open); rotate(B.ra, Z, -0.35 * open);                     // arms lift out about 20 degrees
    model.updateMatrixWorld(true);
    rotate(B.la, X, -0.1 * open); rotate(B.ra, X, -0.1 * open);                      // palms turned a touch forward
    model.updateMatrixWorld(true);
    model.updateMatrixWorld(true);
  }

  // keep the original head, neck, upper chest, shoulders and arms; the smooth new body does the rest
  const keepBone = /Head|Neck|Eye|Shoulder|Arm|Hand|Spine2/;
  for (const m of meshes) {
    const si = m.geometry.attributes.skinIndex, sw = m.geometry.attributes.skinWeight, k = new Float32Array(si.count);
    for (let i = 0; i < si.count; i++) { let best = 0, bi = 0; for (let c = 0; c < 4; c++) { const w = sw.getComponent(i, c); if (w > best) { best = w; bi = si.getComponent(i, c); } }
      k[i] = keepBone.test(m.skeleton.bones[bi].name) ? 1 : 0; }
    m.geometry.setAttribute('aKeep', new THREE.BufferAttribute(k, 1));
  }
  // a dark silhouette with a warm glowing edge (the light is behind them)
  const uRim = { value: 0 };
  const rimShader = (keep) => (sh) => {
    sh.uniforms.uRim = uRim;
    if (keep) sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float aKeep; varying float vKeep;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvKeep = aKeep;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uRim;' + (keep ? '\nvarying float vKeep;' : ''))
      .replace('void main() {', 'void main() {' + (keep ? '\n if (vKeep < .5) discard;' : ''))
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float fr = clamp(1.0 - abs(dot(normalize(-vViewPosition), normal)), 0.0, 1.0); fr = fr * fr * fr;
        totalEmissiveRadiance += vec3(1., .66, .5) * fr * sqrt(fr) * 1.1 * uRim;`);
  };
  const skinMat = new THREE.MeshStandardMaterial({ color: 0x050407, roughness: .5, metalness: .2 }); skinMat.onBeforeCompile = rimShader(true);
  const lowMat = new THREE.MeshStandardMaterial({ color: 0x050407, roughness: .5, metalness: .2 }); lowMat.onBeforeCompile = rimShader(false);
  lowMat.customProgramCacheKey = () => 'low';
  for (const m of meshes) { m.material = skinMat; m.visible = true; m.frustumCulled = false; }
  const low = new THREE.Group(); low.add(lowerSurface(lowMat)); scene.add(low);
  scene.add(new THREE.AmbientLight(0x221833, .35));

  let ringC = new THREE.Vector3(0, 1.62, 0);
  figure = (t, time, tap) => {
    // the orb dives to where their head will be (0 -> 1.1s) and opens into the ring of light (1 -> 2.4s)
    const d = reduce ? 1 : eIO(t / 1.1);
    orb.visible = !reduce && t < 1.4; orb.position.set(ringC.x, lerp(2.4, ringC.y, d), ringC.z - .3);
    const of = clamp01(1 - (t - 1.0) / 0.4); orb.scale.setScalar(lerp(.5, .9, d) * (.4 + .6 * of)); orb.material.opacity = of;
    sky.material.uniforms.uIgn.value = reduce ? 1 : eOut((t - 0.95) / 1.5);
    sky.material.uniforms.uPulse.value = tap > 0 && tap < 1 ? Math.sin(Math.PI * tap) : 0;
    // they rise in front of the light, with their back to us, then turn, lift their head, open their arms
    pose(reduce ? 20 : t);
    model.position.y = base - (reduce ? 0 : (1 - eOut((t - 1.4) / 2.4)) * 1.0);
    model.updateMatrixWorld(true);
    low.position.y = model.position.y - base; low.rotation.y = model.rotation.y;
    uRim.value = reduce ? 1 : clamp01((t - 1.2) / 1.6);
  };
  window.__ringAt = (v) => ringC.copy(v);
}, undefined, () => { $('fail').textContent = 'Could not load your future self. Check your connection and try again.'; $('fail').style.display = 'flex'; });

// ---------- post + layout ----------
const comp = new EffectComposer(renderer); comp.addPass(new RenderPass(scene, camera));
// safety: any invalid pixel (NaN / infinity) becomes black before the glow, so it can't spread over the screen
comp.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); bvec4 bad = bvec4(c.r != c.r || c.r > 1e4, c.g != c.g || c.g > 1e4, c.b != c.b || c.b > 1e4, false);
      gl_FragColor = any(bad) ? vec4(0., 0., 0., 1.) : vec4(max(c.rgb, 0.), 1.); }` }));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.32, 0.12, 0.55)); comp.addPass(new OutputPass());
function resize() {
  const w = innerWidth, h = innerHeight; wide = w >= 640 && w / h >= 1; document.body.classList.toggle('wide', wide);
  renderer.setSize(w, h, false); comp.setSize(w, h); sky.material.uniforms.uR.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
  camera.aspect = w / h; camera.fov = wide ? 30 : 36;
  const sx = wide ? 0.34 : 0;   // on wide screens the figure sits a little left, so the words get their own space
  camera.position.set(sx, wide ? 1.4 : 1.25, wide ? 3.2 : 4.2); look.set(sx, wide ? 1.22 : 0.92, 0);
  camera.updateProjectionMatrix(); camera.lookAt(look); camera.updateMatrixWorld();
  const head = new THREE.Vector3(0, 1.62, 0).project(camera), pr = renderer.getPixelRatio();
  sky.material.uniforms.uC.value.set((head.x * .5 + .5) * w * pr, (head.y * .5 + .5) * h * pr);
  sky.material.uniforms.uRad.value = wide ? .25 : .17;
}
addEventListener('resize', resize); resize();

// ---------- the timeline ----------
let t0 = performance.now(), tapAt = -99;
const now = () => FIXED !== null ? FIXED : (performance.now() - t0) / 1000;
$('gl').addEventListener('pointerdown', () => { if (now() > 7.5) tapAt = now(); });
function frame() {
  const t = now();
  sky.material.uniforms.uT.value = t;
  if (figure) figure(t, t, (t - tapAt) / 1.6);
  for (const [s, at] of words) s.classList.toggle('in', reduce || t >= at);
  $('acts').classList.toggle('in', reduce || t >= ACTS_AT);
  $('scrim').classList.toggle('on', t > 6.8);
  camera.lookAt(look);
  comp.render();
  if (FIXED === null) requestAnimationFrame(frame);
  else document.title = figure ? 'shot' : document.title;
}
requestAnimationFrame(frame);
if (FIXED !== null) { const wait = () => figure ? frame() : setTimeout(wait, 50); wait(); }

// ---------- buttons + hand-off back to the app ----------
const back = (k) => { const p = new URLSearchParams(Q); p.set(k, '1'); p.delete('t'); location.href = './index.html?' + p.toString(); };
$('replay').addEventListener('click', () => { t0 = performance.now(); tapAt = -99; });

if (Q.has('from') && FIXED === null) { const a = $('arrive'); a.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => a.classList.add('out'))); }
